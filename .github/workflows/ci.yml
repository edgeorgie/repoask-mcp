name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # No secrets are provided to this job on purpose. `ask_repo` is
      # designed to work with no LLM key (deterministic citation-only
      # fallback), and `index_repo` works against GitHub unauthenticated, so
      # the whole suite must pass on a bare checkout with zero config. If a
      # test ever needs a key to pass, that is the bug — not this workflow.
      #
      # `npm test` runs `pretest` (npm run build) itself; the explicit Build
      # step above is kept so a compile failure is reported as its own red
      # step rather than buried in the test step's output.
      - name: Test
        run: npm test
